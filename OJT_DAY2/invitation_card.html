<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invitation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }
        .card {
            border: 2px solid #333;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 18px;
        }
        iframe {
            margin: 20px 0;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're Invited to My Birthday!</h1>
        <p>Join me for my birthday celebration at:</p>
        <p><strong>Location:</strong> Vashikaa Prime</p>
        <p><strong>Date:</strong> [Insert Date Here]</p>
        <p><strong>Time:</strong> [Insert Time Here]</p>
        <p>Here's the location on the map:</p>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3669.4129669998206!2d72.56793480000002!3d23.1185758!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e839d24d36101%3A0x941308c48d2bb45f!2sVashikaa%20Prime!5e0!3m2!1sen!2sin!4v1778575725582!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <p>We look forward to seeing you there!</p>
    </div>
</body>
</html>
